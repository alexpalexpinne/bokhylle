[package]
name = "bokhylle-acquisition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rank-releases"
path = "src/bin/rank_releases.rs"

[dependencies]
async-trait = "0.1.92"
bokhylle-core = { version = "0.3.2", path = "../bokhylle-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "multipart", "query", "rustls"] }
roxmltree = "0.21"
schemars = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync"] }
wiremock = "0.6.5"
