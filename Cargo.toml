[workspace]
resolver = "3"
members = ["crates/bokhylle-acquisition","crates/bokhylle-core", "crates/bokhylle-importer", "crates/bokhylle-library", "crates/bokhylle-metadata", "crates/bokhylle-server", "xtask"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/alexpalexpinne/bokhylle"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false
